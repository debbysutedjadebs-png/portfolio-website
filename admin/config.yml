backend:
  name: github
  repo: debbysutedjadebs-png/portfolio-website
  branch: main
  base_url: https://deby-portfolio-auth.hellodebbbeh.workers.dev
  auth_endpoint: auth

media_folder: images
public_folder: /images
publish: true
site_url: /
display_url: /
show_preview_links: false

collections:
  - name: website
    label: Website Content
    files:
      - name: settings
        label: Homepage, About & Contact
        file: content/site.json
        format: json
        fields:
          - {label: Nama Website, name: site_name, widget: string}
          - {label: Judul Browser / SEO, name: page_title, widget: string}
          - {label: Sapaan di Homepage, name: greeting, widget: string}
          - {label: Nama yang Ditampilkan, name: display_name, widget: string}
          - {label: Jabatan dan Lokasi, name: job_location, widget: string}
          - {label: Headline Utama, name: hero_headline, widget: string}
          - {label: Headline Highlight, name: hero_highlight, widget: string}
          - {label: Current Company, name: current_company, widget: string}
          - {label: Ringkasan Pengalaman, name: experience_summary, widget: string}
          - {label: Expertise, name: specialties, widget: string}
          - {label: Judul Section Work, name: work_heading, widget: string}
          - {label: Judul Section About, name: about_heading, widget: string}
          - {label: Foto Profil, name: profile_image, widget: image}
          - {label: Tentang Saya / Bio, name: about_intro, widget: text}
          - label: Pengalaman Kerja
            name: experience
            widget: list
            summary: '{{fields.role}} — {{fields.company}}'
            fields:
              - {label: Periode, name: period, widget: string}
              - {label: Jabatan, name: role, widget: string}
              - {label: Current Company, name: current_company, widget: string}
              - {label: Deskripsi, name: description, widget: text}
          - {label: Keahlian / Skills, name: skills, widget: list, field: {label: Keahlian, name: skill, widget: string}}
          - {label: Judul Kontak, name: contact_heading, widget: string}
          - {label: Highlight Judul Kontak, name: contact_highlight, widget: string}
          - {label: Lokasi Kontak, name: contact_location, widget: string}
          - {label: Link LinkedIn, name: linkedin, widget: string}
          - {label: Link Behance, name: behance, widget: string}
          - {label: Link Instagram, name: instagram, widget: string}
  - name: portfolio
    label: Portfolio
    files:
      - name: projects
        label: Kelola Projects
        file: content/projects.json
        format: json
        fields:
          - label: Daftar Project
            name: projects
            widget: list
            summary: '{{fields.title}} — {{fields.year}}'
            collapsed: true
            fields:
              - {label: Judul Project, name: title, widget: string}
              - {label: Kategori, name: cat, widget: select, options: ["Packaging Design", "Key Visual & POSM", "Retail Activation", "Brand Campaign", "Creative Direction", "Internal Branding", "Other"], allow_add: true}
              - {label: Tahun, name: year, widget: string}
              - {label: Perusahaan / Brand, name: company, widget: string}
              - {label: Deskripsi Lama / Ringkasan (fallback untuk project lama), name: desc, widget: text, required: false}
              - label: Section Case Study (judul bebas, bisa ditambah & diurutkan)
                name: sections
                widget: list
                required: false
                collapsed: true
                summary: '{{fields.heading}}'
                fields:
                  - {label: Judul Section (bebas), name: heading, widget: string, required: false}
                  - {label: Isi Section, name: body, widget: text, required: false}
              - label: Galeri Gambar
                name: images
                widget: list
                field: {label: Gambar, name: image, widget: image}
              - {label: Tampilkan di Website, name: published, widget: boolean, default: true, required: false}
